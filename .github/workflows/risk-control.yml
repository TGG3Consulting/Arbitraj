name: Isolated trace of route 0392
on:
  push:
    branches: [audit/control-precheck-risk-20261125]
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: "never"
jobs:
  controlled-risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          path: release
          ref: 91b86c672aa73ef0ba9ab6e1870fc9cc647cce4f
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: release -> target
          shared-key: release-size-matrix
      - shell: bash
        run: |
          set -e
          p=harness/tools/release_size_matrix
          python "$p/adapt.py" release
          python "$p/trace_0392.py" release
          cd release
          if ! cargo test --locked --test core_size_release_matrix release_size_matrix_routes -- --nocapture > "$RUNNER_TEMP/trajectory.log" 2>&1; then
            grep -E '^error(\[E[0-9]+\])?:|panicked at|assertion .*failed|^test .*FAILED|^ *-->' -A 5 "$RUNNER_TEMP/trajectory.log" | head -n 75
            exit 1
          fi
          sed -n -E 's/^(test [^ ]+ \.\.\. )?TRACE0392 //p' "$RUNNER_TEMP/trajectory.log" > ../trace-0392.jsonl
          test "$(wc -l < ../trace-0392.jsonl)" -eq 10
      - uses: actions/upload-artifact@v4
        with:
          name: trajectory-0392
          path: trace-0392.jsonl
