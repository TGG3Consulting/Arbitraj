name: Independent market admission audit
on:
  push:
    branches: [codex/wallet-route-control-20261125]
jobs:
  native:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
    strategy:
      fail-fast: false
      matrix:
        ref: [9cd91e18c6100c97bc5186937d40f776c43cf10a, 80ed8ba60e56036b266a075013fda5ab9de9cad3, 4c4f4b0424ed7974397802c9eab64cf2b67f39e3, 91b86c672aa73ef0ba9ab6e1870fc9cc647cce4f]
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: release
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: release
          shared-key: wallet-control
      - working-directory: release
        env:
          REV: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          target=tests/core_start_sell_guard.rs
          grep -F '.filter(|(v, _)| enabled(core, v))' src/core/rebuild.rs >/dev/null
          cat ../control/tools/wallet_control/gate-test.fragment >> "$target"
          case "$REV" in
            4c4f*) sed 's/e\.asset\.contract =/e.asset.bsc_contract =/' ../control/tools/wallet_control/lock-test.fragment >> "$target";;
            91b86*) cat ../control/tools/wallet_control/lock-test.fragment >> "$target";;
          esac
          cargo test --locked --test core_start_sell_guard wallet_audit_ -- --nocapture | tee "$RUNNER_TEMP/wallet-test.out"
          { echo "SHA $REV"; grep -E 'WALLET_(GATE|LOCK)|test result:' "$RUNNER_TEMP/wallet-test.out"; } > "$RUNNER_TEMP/wallet-audit.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: admission-${{ matrix.ref }}
          path: ${{ runner.temp }}/wallet-audit.txt
