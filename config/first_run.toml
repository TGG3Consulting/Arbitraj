# --- Параллельный расчёт кандидатов (решение 88) ---
[[section]]
title = "Расчёт кандидатов — параллельность и срок (решение 88)"
intro = "Расчёты кандидатов идут параллельно, свой на каждый; узел ими почти не нагружается (счёт в памяти, цена газа — общий кэш на блок). Срок не даёт расчёту зависнуть на медленном или перегруженном узле."

[[section.rec]]
name = "profit.calc_timeout_ms"
area = "вся система"
unit = "мс"
value = "2000"
source = "Ориентир (docs/SETTINGS.md, решение 88)"
rationale = "Общий срок одного расчёта: вышел — отказ «не уложился в срок», направление встанет на расчёт снова следующим тиком. 2000 мс — с запасом на обычный расчёт, но ловит зависание, когда узел не отвечает."
prefill = { kind = "Global" }

[[section.rec]]
name = "profit.calc_concurrency"
area = "вся система"
unit = "расчётов"
value = "0"
source = "Ориентир (docs/SETTINGS.md, решение 88)"
rationale = "0 — без предела: свой расчёт на каждый кандидат, ни один не ждёт. Если расчёты заметно грузят процессор сервера — поставить по числу ядер."
prefill = { kind = "Global" }

