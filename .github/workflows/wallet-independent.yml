name: Independent wallet incident controls
on:
  push:
    branches: [codex/wallet-independent-review]
jobs:
  cyber:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sha: [34322e1617e0a393c2e60816ca61f36705062348, 91b86c672aa73ef0ba9ab6e1870fc9cc647cce4f]
    env:
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          path: release
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: release -> target
          shared-key: release-size-matrix
      - name: Replay withdrawal responses offline
        working-directory: release
        run: |
          set -euo pipefail
          p=../harness/tools/wallet_incident_control
          cp "$p/cyber.json" tests/cyber_four_cases.json
          if [[ -f tests/binance_withdraw_ready.rs ]]; then
            suite=binance_withdraw_ready
            cat "$p/replay.rs" "$p/current.rs" >> tests/$suite.rs
          else
            suite=historical_wallet_cyber
            cat "$p/replay.rs" "$p/legacy.rs" > tests/$suite.rs
          fi
          if ! cargo test --locked --test "$suite" -- --nocapture > "$RUNNER_TEMP/result.txt" 2>&1; then
            grep -E 'error(\[E[0-9]+\])?:|panicked at|assertion|FAILED' -A 5 "$RUNNER_TEMP/result.txt" | head -n 80 || true
            exit 1
          fi
          git rev-parse HEAD > control.txt
          grep -E 'CYBER_RESULT|test result:' "$RUNNER_TEMP/result.txt" >> control.txt
          test "$(grep -c 'CYBER_RESULT' control.txt)" -eq 4
      - uses: actions/upload-artifact@v4
        with:
          name: cyber-${{ matrix.sha }}
          path: release/control.txt
