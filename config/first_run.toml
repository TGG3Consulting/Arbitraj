rationale = "*метод:* старт 20 — ориентир без замера. Живой случай один — PIT: за остаток стоимостью около 0 введено 44.88 (выручка всей сделки); его ловит любое N. Законное превышение — рост цены между продажей человека и вводом (или продажа на другой площадке дороже котировки); таких замеров в данных бота нет. 20 % — та же граница движения цены, что Тигран задал для продажи здесь (stuck.relay_max_loss_pct = 20): больше — решает человек. Ложный отказ безопасен — бот только просит проверить сумму; верную сумму можно ввести, временно очистив настройку. Подстройка — по журналу отказов «больше чем на … %»."
