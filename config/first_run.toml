rationale = "Тигран: «каждые 1000 мс». Удержание снимается, когда депозит набирает подтверждения сети BSC (блок ≈ 1–3 с), — секундный шаг ловит снятие без лишней задержки; запрос вывода — один в секунду. Исключение — Bybit: в документации вывода «you can only withdraw once every 10 seconds per chain/coin combination», поэтому у площадки bybit задать 10000 (считается ли отказ попыткой — в документации не сказано)."
