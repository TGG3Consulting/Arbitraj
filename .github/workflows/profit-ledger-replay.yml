name: Private ledger replay
on:
  push:
    branches: [codex/profit-all-card-replay-20261125]
permissions:
  contents: read
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - name: Identify release source
        id: source
        run: |
          sha=$(cat harness/tools/profit_ledger_replay/target-sha.txt)
          [[ "$sha" =~ ^[a-f0-9]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: release
      - name: Create one-time receiver
        run: |
          umask 077
          /usr/bin/python3 harness/tools/profit_ledger_replay/envelope.py keygen "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/public.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: receiver-${{ github.run_attempt }}
          path: ${{ runner.temp }}/public.pem
          retention-days: 1
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: release -> target
          shared-key: tests
      - name: Prepare both pinned sources
        run: |
          git -C release fetch -q --depth=1 origin 15095ea3c6b4bd27291d026e857f14f6556a1e49
          git -C release worktree add --quiet --detach ../baseline FETCH_HEAD
      - name: Build native ledger and chain replay
        run: |
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/release/target"
          controls="$GITHUB_WORKSPACE/harness/tools/profit_ledger_replay"
          for tree in baseline release; do
            (
              cd "$tree"
              cat "$controls/replay.rs" "$controls/chain_replay.rs" > tests/profit_private_replay.rs
              variant=old
              if test -f src/venues/bsc_dex/wallet/deposit_log.rs; then variant=new; fi
              cat "$controls/receipt_$variant.rs" >> src/venues/bsc_dex/wallet/transfer_status.rs
              if ! cargo test --locked --test profit_private_replay --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/build.jsonl" 2> "$RUNNER_TEMP/build.txt"; then
                grep -E 'error(\[E[0-9]+\])?:|--> ' -A 5 "$RUNNER_TEMP/build.txt" | head -n 80 || true
                exit 1
              fi
              binary=$(jq -r 'select(.reason=="compiler-artifact" and .target.name=="profit_private_replay" and .executable != null) | .executable' "$RUNNER_TEMP/build.jsonl")
              cp "$binary" "$RUNNER_TEMP/suite-$tree"
              git rev-parse HEAD > "$RUNNER_TEMP/$tree-sha.txt"
            )
          done
      - name: Receive anonymous data
        working-directory: harness
        run: |
          ref=refs/heads/codex/ledger-envelope-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          for i in $(seq 1 28); do
            if git ls-remote --exit-code origin "$ref" >/dev/null 2>&1; then break; fi
            sleep 25
          done
          git fetch -q --depth=1 origin "$ref"
          git show FETCH_HEAD:ledger.enc > "$RUNNER_TEMP/envelope"
          /usr/bin/python3 tools/profit_ledger_replay/envelope.py open "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/private.json" "$RUNNER_TEMP/envelope"
          rm -f "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/envelope"
      - name: Replay every observed card and publish aggregate only
        run: |
          export PRIVATE_LEDGER_INPUT="$RUNNER_TEMP/private.json"
          for tree in baseline release; do
            export LEDGER_RESULT="$RUNNER_TEMP/cashflow-$tree.json"
            export CHAIN_RESULT="$RUNNER_TEMP/chain-$tree.json"
            if ! "$RUNNER_TEMP/suite-$tree" > "$RUNNER_TEMP/replay.txt" 2>&1; then
              grep -E 'panicked at|assertion|FAILED' -A 5 "$RUNNER_TEMP/replay.txt" | head -n 80 || true
              exit 1
            fi
            test -s "$LEDGER_RESULT" && test -s "$CHAIN_RESULT"
          done
      - name: Remove private test inputs
        if: always()
        run: rm -f "$RUNNER_TEMP/private.json" "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/envelope"
      - uses: actions/upload-artifact@v4
        with:
          name: aggregate-${{ steps.source.outputs.sha }}
          path: |
            ${{ runner.temp }}/cashflow-*.json
            ${{ runner.temp }}/chain-*.json
            ${{ runner.temp }}/*-sha.txt
