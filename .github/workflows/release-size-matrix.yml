name: Release size matrix
on:
  push:
    branches: ["test/release-size-matrix-*"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          rows = json.loads(Path("tools/release_size_matrix/releases.json").read_text(encoding="utf-8-sig"))
          assert len(rows) == len({r["sha"] for r in rows}) == 52
          if os.environ["GITHUB_REF_NAME"].endswith("-smoke"):
              anchors = ("f896a133", "cc1b4ef0", "7491b1e7", "8e02cc8")
              rows = [r for r in rows if r["sha"].startswith(anchors)]
              assert len(rows) == len(anchors)
          print("matrix=" + json.dumps({"include": rows}, separators=(",", ":")))
          PY
  replay:
    needs: inventory
    runs-on: ubuntu-latest
    name: Replay ${{ matrix.run }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      RELEASE_SHA: ${{ matrix.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          path: release
      - name: Verify revision and adapt test interface
        shell: bash
        run: |
          test "$(git -C release rev-parse HEAD)" = "$RELEASE_SHA"
          python harness/tools/release_size_matrix/adapt.py release
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: release -> target
          shared-key: release-size-matrix
      - name: Run native size selection against the common cases
        shell: bash
        working-directory: release
        run: |
          set -eo pipefail
          cargo test --locked --test core_size_release_matrix release_size_matrix -- --exact --nocapture > "$RUNNER_TEMP/replay.log" 2>&1 || {
            grep -m 15 -A 4 -E 'error(\[E[0-9]+\])?:|panicked at|assertion|FAILED' "$RUNNER_TEMP/replay.log" | head -n 80 || true
            exit 1
          }
          sed -n 's/^SIZE_MATRIX //p' "$RUNNER_TEMP/replay.log" > ../replay.jsonl
          test "$(wc -l < ../replay.jsonl)" -eq 180
      - uses: actions/upload-artifact@v4
        with:
          name: replay-${{ matrix.sha }}
          path: replay.jsonl
          if-no-files-found: error
