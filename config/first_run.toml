# --- Делистинги (решение 175) ---
[[section]]
title = "Делистинги (решение 175)"
intro = "Монета в делистинге на любой стороне сделки и до прекращения торгов меньше порога — сделки нет (живой случай 05.11: KuCoin снял ION/USDT с торгов, «разница цены» была из-за делистинга). Решение 226 (08.11): одно правило для всех источников — справочник пар и анонсы делистинга (время берётся из анонса; не определено — монета не торгуется). Метка ST — по delist.st_block. Биржа без источника делистингов в официальном API — «неизвестно», не блокирует. Не задано — проверка выключена."

