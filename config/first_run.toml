intro = "Из официальной документации Kraken (спот REST, Funding (Beta), WebSocket v2); живых ответов ещё нет — из среды разработки Kraken закрыт: сверить на сервере бота (tests/README.md, раздел Kraken). Сначала — одна живая запись методов Funding: есть ли сеть BSC и contract_address (вердикт анализа). Перед торговлей — замер нагрузки при «Стопе» (решение 109). Ключ без 2FA (OTP) с правами Query Funds, Withdraw Funds, Query Open/Closed Orders, Create & Modify Orders, Cancel/Close Orders, WebSocket interface; без «Add withdrawal addresses». Адреса вывода (кошельки DEX, депозиты других бирж) — заранее в адресной книге Kraken. Ключ бота не использовать в других программах (nonce)."

