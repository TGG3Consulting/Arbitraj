name: Historical quote controls
on:
  push:
    branches: ["test/quote-recovery-before-20261126"]
permissions:
  contents: read
jobs:
  before:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
      - run: cargo test --locked --test core_exec_book_238
