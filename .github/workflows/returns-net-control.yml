name: Detached group settlement control
on:
  push:
    branches: [codex/returns-net-gate-2511]
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy,rustfmt
      - name: Format the changed Rust files for review
        run: |
          git diff --name-only 15095ea3 HEAD -- '*.rs' | xargs rustfmt --edition 2024 --config skip_children=true
          git diff -- '*.rs' > /tmp/return-format.patch
      - uses: actions/upload-artifact@v4
        with:
          name: return-format
          path: /tmp/return-format.patch
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
      - name: Actual detached return and relay/return regressions
        run: |
          cargo test --locked --lib core::manual_price::tests
          cargo test --locked --test core_relay_reserve_417 --test core_credit_review3b_t198 --test core_usdt_return_close --test core_usdt_return_split --test core_usdt_return_retry --test core_usdt_return_manual
      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings
