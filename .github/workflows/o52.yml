name: Base and Ethereum catalog coverage
on: push
permissions:
  contents: read
jobs:
  catalog:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
          save-if: false
      - run: cargo test --locked --test base_ethereum_llama_top --test base_ethereum_catalog_coverage
