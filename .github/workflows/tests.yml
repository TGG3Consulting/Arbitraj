name: Historical MEXC quote control
on:
  push:
    branches: ["test/mexc-quote-before-20261126"]
permissions:
  contents: read
jobs:
  control:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
      - run: cargo test --locked --lib historical_quote
