# --- Повтор вывода после «заблокировано для вывода» (решение 166) ---
[[section]]
title = "Повтор вывода после «заблокировано для вывода» (решение 166)"
intro = "Покупка прошла, а вывод монеты с биржи отклонён ответом «средства временно заблокированы для вывода» (MEXC 16021, KuCoin 115008, Binance −4060, Bybit 131085 — удержание недавнего депозита), и прежний вывод точно не ушёл — бот повторяет тот же вывод. Успех — сделка идёт дальше; все повторы неудачны — как раньше (остановка / перегон) с понятной причиной. Не задано — без повторов."

