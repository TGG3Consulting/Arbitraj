name: Tests (parallel)
on: workflow_dispatch
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
          save-if: false
      - name: Compare 216 physical exact-input measurements
        env:
          SPECTRA_REPORT: ${{ runner.temp }}/report.json
        run: cargo test --locked --lib recorded_targets_bound_the_forward_calls_for_both_pool_families
      - uses: actions/upload-artifact@v4
        with:
          name: spectra-inputs
          path: ${{ runner.temp }}/report.json
