name: Tests (parallel)
on: workflow_dispatch
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
jobs:
  quotes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
          save-if: false
      - name: Compare 216 physical exact-input measurements
        env:
          SPECTRA_REPORT: ${{ runner.temp }}/report.json
        run: cargo test --locked --lib control_all_paid_inputs
      - uses: actions/upload-artifact@v4
        with:
          name: spectra-inputs
          path: ${{ runner.temp }}/report.json
      - name: Require correct wallet amounts and actual intermediate debits
        run: cargo test --locked --test base_spectra_math
      - name: Check the known input bound and cold search costs on both families
        run: cargo test --locked --lib quote::spectra::tests
