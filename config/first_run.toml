rationale = "Тигран 08.11: «любая монета, делистинг которой на бирже X наступит меньше чем через N часов, на этой бирже больше не торгуется», N = 12 — единое правило для всех источников, включая анонсы (время делистинга берётся из анонса). Раньше (05.11) советовалось 72."
prefill = { kind = "Global" }

