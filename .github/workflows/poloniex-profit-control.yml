name: Poloniex manual settlement control
on:
  push:
    branches: [codex/poloniex-profit-control-ci-20261125]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
      - run: rustfmt --check --edition 2024 --config skip_children=true src/api/control.rs src/api/server.rs src/core/manual_price.rs src/core/manual_price/tests.rs src/core/mod.rs src/core/sale_preview.rs src/core/sale_price.rs src/core/sale_price_text.rs src/core/trade_ops.rs src/notify/press_confirm.rs src/venues/poloniex/transfers.rs
      - run: cargo test --locked --lib core::sale_preview && cargo test --locked --lib core::manual_price && cargo test --locked --lib venues::poloniex::transfers
      - run: cargo test --locked --test core_exec_book_238 manual_confirmation_reads_fresh_depth
      - run: cargo clippy --lib --locked -- -D warnings
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
