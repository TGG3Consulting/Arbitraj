name: SHOPINX archived width and executable volumes
on:
  push:
    branches: [audit/shopinx-volume-20261125]
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: "never"
jobs:
  shop-control:
    strategy:
      fail-fast: false
      matrix:
        version: [before, after]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          path: release
          ref: 91b86c672aa73ef0ba9ab6e1870fc9cc647cce4f
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: release -> target
          shared-key: release-size-matrix
      - shell: bash
        run: |
          set -e
          p=harness/tools/release_size_matrix
          python "$p/shop_two_leg.py" release
          python "$p/shop_width.py" release
          python "$p/shop_target.py" release
          python "$p/shop_live.py" release
          if [[ '${{ matrix.version }}' == 'after' ]]; then
            git -C release apply "../$p/shop_graph_fix.patch"
          fi
          python "$p/shop_depth.py" release
          cd release
          if ! SHOP_TRACE=1 cargo test --locked --test native_route_release_matrix shop_depth_control -- --nocapture > "$RUNNER_TEMP/shop.log" 2>&1; then
            grep -E '^error(\[E[0-9]+\])?:|panicked at|assertion .*failed|^test .*FAILED|^ *-->' -A 5 "$RUNNER_TEMP/shop.log" | head -n 75
            exit 1
          fi
          sed -n 's/^SHOP_DEPTH //p' "$RUNNER_TEMP/shop.log" > "$RUNNER_TEMP/shop-volume.jsonl"
          test -s "$RUNNER_TEMP/shop-volume.jsonl"
          test "$(wc -l < "$RUNNER_TEMP/shop-volume.jsonl")" -eq 72
          if ! cargo test --locked --test native_route_release_matrix shop_live_control -- --nocapture > "$RUNNER_TEMP/live.log" 2>&1; then
            grep -E '^error(\[E[0-9]+\])?:|panicked at|assertion .*failed|^test .*FAILED|^ *-->' -A 5 "$RUNNER_TEMP/live.log" | head -n 75
            exit 1
          fi
          sed -n 's/^SHOP_LIVE //p' "$RUNNER_TEMP/live.log" > "$RUNNER_TEMP/live.jsonl"
          test "$(wc -l < "$RUNNER_TEMP/live.jsonl")" -eq 13
          grep -E "^SHOP_SPLIT_TRACE qty=18917" "$RUNNER_TEMP/shop.log" | sort -u | head -n 35 > "$RUNNER_TEMP/split.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: shop-control-${{ matrix.version }}
          path: |
            ${{ runner.temp }}/shop-volume.jsonl
            ${{ runner.temp }}/split.txt
            ${{ runner.temp }}/live.jsonl



