name: Wallet audit guard regressions
on:
  push:
    branches: ["audit/wallet-case-guards"]
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
jobs:
  reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 7491b1e7e977be6648c0a538f40169b521ceff45
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-size-matrix
      - name: Check presell funding, admission guards and withdrawal readiness
        shell: bash
        run: |
          if ! cargo test --locked --test bsc_dex_presell_slot_t192 --test bsc_dex_presell_gather_t166 --test core_busy_calc_267 --test core_coin_reentry_t179 --test binance_withdraw_ready > "$RUNNER_TEMP/wallet.log" 2>&1; then
            grep -m 12 -A 4 -E 'error(\[E[0-9]+\])?:|panicked at|assertion|FAILED' "$RUNNER_TEMP/wallet.log" | head -n 80 || true
            exit 1
          fi
          grep -E 'Running tests/|running [0-9]+ tests|test result:' "$RUNNER_TEMP/wallet.log" > wallet-results.txt
      - uses: actions/upload-artifact@v4
        with:
          name: wallet-guard-results
          path: wallet-results.txt
