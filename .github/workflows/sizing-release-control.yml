name: Completed sizing controls
on:
  push:
    branches: [audit/all-sizing-replay-20261125]
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: d328baf1853fe1c6ba69e672d2cbaf5e819a6e0d
          path: release
      - uses: actions/checkout@v4
        with:
          ref: 1b6ca7fafce309b81c80278385ac007f22d7d1ce
          path: historical
      - uses: actions/checkout@v4
        with:
          path: shop
          ref: 375bd387f318f656984689348e964a687bfbb255
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: release -> target
          shared-key: release-size-matrix
      - shell: bash
        run: |
          set -e
          p=historical/tools/release_size_matrix
          python "$p/adapt.py" release
          python "$p/ab_0392.py" release
          python control/tools/sizing_control.py release
          python "$p/stored_compare.py" release "$p/stored_cases.json"
          python "$p/actual_v2.py" stage release "$p/actual_v2_cases.json"
          python "$p/actual_v3.py" stage release "$p/actual_v3_cases.json"
          python "$p/with_history.py" release
          python "$p/stage_risk.py" release
          k=shop/tools/release_size_matrix
          python "$k/shop_two_leg.py" release
          python "$k/shop_width.py" release
          python "$k/shop_target.py" release
          python "$k/shop_live.py" release
          python control/tools/sizing_archive.py release
          cd release
          cargo test --locked --lib precheck_hint::tests
          for row in 'core_size_actual_v2 actual_v2_matrix risk' 'native_route_release_matrix shop_live_control shop'; do
            read -r test name output <<< "$row"
            if ! cargo test --locked --test "$test" "$name" -- --nocapture > "$RUNNER_TEMP/$output.log" 2>&1; then
              grep -E '^error(\[E[0-9]+\])?:|panicked at|assertion .*failed|^test .*FAILED|^ *-->' -A 6 "$RUNNER_TEMP/$output.log" | head -n 75
              exit 1
            fi
            grep -E 'ACTUAL_V2_MATRIX|NATIVE_NEIGHBOUR|NATIVE_RISK_PRECHECK' "$RUNNER_TEMP/$output.log" > "../size-$output.jsonl"
          done
          cargo test --locked --test core_card_disconnected --test core_precheck_fast_266
          cargo clippy --locked --lib -- -D warnings
          for arm in off on; do
            if ! SIZING_ARM="$arm" cargo test --locked --test core_size_release_matrix release_size_matrix_routes -- --nocapture > "$RUNNER_TEMP/size-$arm.log" 2>&1; then
              grep -E '^error(\[E[0-9]+\])?:|panicked at|assertion .*failed|^test .*FAILED|^ *-->' -A 5 "$RUNNER_TEMP/size-$arm.log" | head -n 75
              exit 1
            fi
            sed -n -E 's/^(test [^ ]+ \.\.\. )?PLATEAU_CONTROL //p' "$RUNNER_TEMP/size-$arm.log" > "../size-$arm.jsonl"
            test "$(wc -l < ../size-$arm.jsonl)" -eq 5120
          done
      - uses: actions/upload-artifact@v4
        with:
          name: native-sizing-comparison
          path: size-*.jsonl
