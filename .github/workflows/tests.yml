name: Tests (parallel)
on: workflow_dispatch
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
jobs:
  raindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
          save-if: false
      - run: 'cargo test --locked --lib raindex::'
      - run: cargo test --locked --test base_raindex_settlement
  wallet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --prefix ui --no-audit --no-fund
      - working-directory: ui
        run: node --test tests/raindexDeploy.test.js
      - working-directory: ui
        run: npm run build
