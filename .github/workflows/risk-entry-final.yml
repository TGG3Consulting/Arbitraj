name: Recorded DEOD and RT native fast-entry control
on:
  push:
    branches: [audit/sizing-risk-final-20261125]
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_INCREMENTAL: '0'
  CARGO_TERM_COLOR: never
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 2925a361bb88edff0ee1aab3e18bdd3e6ff5b843
          path: release
      - uses: actions/checkout@v4
        with:
          ref: 1b6ca7fafce309b81c80278385ac007f22d7d1ce
          path: historical
      - uses: actions/checkout@v4
        with:
          path: shop
          ref: 375bd387f318f656984689348e964a687bfbb255
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: release -> target
          shared-key: release-size-matrix
      - shell: bash
        run: |
          set -e
          p=historical/tools/release_size_matrix
          python "$p/adapt.py" release
          python "$p/ab_0392.py" release
          python control/tools/sizing_control.py release
          python "$p/stored_compare.py" release "$p/stored_cases.json"
          python "$p/actual_v2.py" stage release "$p/actual_v2_cases.json"
          python "$p/actual_v3.py" stage release "$p/actual_v3_cases.json"
          python "$p/with_history.py" release
          python "$p/stage_risk.py" release
          k=shop/tools/release_size_matrix
          python "$k/shop_two_leg.py" release
          python "$k/shop_width.py" release
          python "$k/shop_target.py" release
          python "$k/shop_live.py" release
          python control/tools/sizing_cpu.py release
          python control/tools/sizing_archive.py release
          python control/tools/sizing_entry.py release
          python control/tools/sizing_risk_side.py release
          python control/tools/sizing_asset_serde.py release
          cd release
          if ! cargo test --locked --test core_size_actual_v2 actual_v2_matrix -- --nocapture > "$RUNNER_TEMP/risk.log" 2>&1; then
            grep -E '^error(\[E[0-9]+\])?:|panicked at|assertion .*failed|stack overflow|FAILED|^ *-->' -A 5 "$RUNNER_TEMP/risk.log" | head -n 70
            exit 1
          fi
          grep -E 'NATIVE_RISK_PRECHECK|ACTUAL_V2_MATRIX' "$RUNNER_TEMP/risk.log" > ../risk-native.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: native-evidence
          path: risk-native.jsonl
  deployed_baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: control
      - uses: actions/checkout@v4
        with:
          ref: 15095ea3c6b4bd27291d026e857f14f6556a1e49
          path: release
      - uses: actions/checkout@v4
        with:
          ref: 1b6ca7fafce309b81c80278385ac007f22d7d1ce
          path: historical
      - uses: actions/checkout@v4
        with:
          path: shop
          ref: 375bd387f318f656984689348e964a687bfbb255
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: release -> target
          shared-key: release-size-matrix
      - shell: bash
        run: |
          set -e
          p=historical/tools/release_size_matrix
          python "$p/adapt.py" release
          python "$p/ab_0392.py" release
          python "$p/stored_compare.py" release "$p/stored_cases.json"
          python "$p/actual_v2.py" stage release "$p/actual_v2_cases.json"
          python "$p/actual_v3.py" stage release "$p/actual_v3_cases.json"
          python "$p/with_history.py" release
          python "$p/stage_risk.py" release
          k=shop/tools/release_size_matrix
          python "$k/shop_two_leg.py" release
          python "$k/shop_width.py" release
          python "$k/shop_target.py" release
          python "$k/shop_live.py" release
          python control/tools/sizing_cpu.py release
          python control/tools/sizing_asset_serde.py release
          cd release
          if ! cargo test --locked --test core_size_actual_v2 actual_v2_matrix -- --nocapture > "$RUNNER_TEMP/risk.log" 2>&1; then
            grep -E '^error(\[E[0-9]+\])?:|panicked at|assertion .*failed|stack overflow|FAILED|^ *-->' -A 5 "$RUNNER_TEMP/risk.log" | head -n 70
            exit 1
          fi
          grep -E 'ACTUAL_V2_MATRIX' "$RUNNER_TEMP/risk.log" > ../risk-baseline.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: baseline-evidence
          path: risk-baseline.jsonl
