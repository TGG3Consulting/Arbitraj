name: Encrypted historical market comparison
on:
  push:
    branches: [audit/bsc-v2-point-261126]
permissions:
  contents: read
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: '0'
      CARGO_PROFILE_TEST_DEBUG: '0'
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - name: Create ephemeral sealed-input receiver
        run: |
          umask 077
          /usr/bin/python3 harness/tools/release_size_matrix/market_envelope.py keygen "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/public.pem"
      - uses: actions/upload-artifact@v4
        with:
          name: receiver
          path: ${{ runner.temp }}/public.pem
          retention-days: 1
      - uses: actions/checkout@v4
        with:
          path: release
          ref: acb36e580ad19b6a63b1330bcb4f15b3040e0e12
      - uses: actions/checkout@v4
        with:
          path: base
          ref: 2925a361bb88edff0ee1aab3e18bdd3e6ff5b843
      - uses: actions/checkout@v4
        with:
          path: previous
          ref: 3ca92702e0fd45be2148af3e1bc8b81c3d8c852b
      - uses: actions/checkout@v4
        with:
          path: old
          ref: 15095ea3c6b4bd27291d026e857f14f6556a1e49
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: release -> target
          shared-key: release-size-matrix
      - name: Receive private inputs, replay and seal output
        shell: bash
        run: |
          set -euo pipefail
          ref=refs/heads/audit/market-envelope-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          for i in $(seq 1 35); do
            if git -C harness ls-remote --exit-code origin "$ref" >/dev/null 2>&1; then break; fi
            sleep 25
          done
          git -C harness fetch -q --depth=1 origin "$ref"
          git -C harness show FETCH_HEAD:market.enc > "$RUNNER_TEMP/enc"
          p="$GITHUB_WORKSPACE/harness/tools/release_size_matrix"
          env="$p/market_envelope.py"
          /usr/bin/python3 "$env" open "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/data.json" "$RUNNER_TEMP/enc"
          rm "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/enc"
          export V2_INPUT="$RUNNER_TEMP/data.json"
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/release/target"
          python -c 'import json,os,pathlib;pathlib.Path(os.environ["RUNNER_TEMP"],"return.pem").write_text(json.load(open(os.environ["V2_INPUT"]))["return_key"])'
          for tree in old base previous release; do
            export V2_OUT="$RUNNER_TEMP/$tree.json"
            cp "$p/v2_point.rs" "$tree/tests/v2_point.rs"
            if ! (cd "$tree" && cargo test --locked --test v2_point > "$RUNNER_TEMP/$tree.log" 2>&1); then
              grep -E 'error(\[E[0-9]+\])?:|panicked at|FAILED|assertion' -A 4 "$RUNNER_TEMP/$tree.log" | head -n 75 || true
              exit 1
            fi
          done
          python - "$RUNNER_TEMP" <<'PY'
          import pathlib,sys,gzip,json
          p=pathlib.Path(sys.argv[1]);d={k:json.loads((p/(k+'.json')).read_bytes()) for k in ('old','base','previous','release')};assert all(len(v)==len(d['base'])>0 for v in d.values());(p/'results.gz').write_bytes(gzip.compress(json.dumps(d).encode()))
          PY
          /usr/bin/python3 "$env" seal "$RUNNER_TEMP/return.pem" "$RUNNER_TEMP/result.enc" "$RUNNER_TEMP/results.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-native-result
          path: ${{ runner.temp }}/result.enc
          retention-days: 1
