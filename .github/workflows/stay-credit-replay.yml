name: STAY on-chain credit replay
on:
  push:
    branches: ["audit/stay-credit-replay"]
permissions:
  contents: read
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: never
jobs:
  replay:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sha:
          - 343d90ad4e0b7e2ec71ea6eba12792ca629b9dae
          - 7491b1e7e977be6648c0a538f40169b521ceff45
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          path: release
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: release -> target
          shared-key: release-size-matrix
      - name: Replay recorded STAY transfers and run credit guards
        working-directory: release
        shell: bash
        run: |
          cat ../harness/tools/stay_credit_replay/scenario.rs >> tests/core_credit_chain.rs
          args=(--test core_credit_chain)
          if [[ -f tests/core_credit_chain_418.rs ]]; then args+=(--test core_credit_chain_418); fi
          if ! cargo test --locked "${args[@]}" -- --nocapture > "$RUNNER_TEMP/stay.log" 2>&1; then
            grep -m 12 -A 4 -E 'error(\[E[0-9]+\])?:|panicked at|assertion|FAILED' "$RUNNER_TEMP/stay.log" | head -n 80 || true
            exit 1
          fi
          grep -oE 'STAY_REPLAY .*' "$RUNNER_TEMP/stay.log" > stay-results.txt
          test "$(wc -l < stay-results.txt)" -eq 4
      - uses: actions/upload-artifact@v4
        with:
          name: stay-replay-${{ matrix.sha }}
          path: release/stay-results.txt
