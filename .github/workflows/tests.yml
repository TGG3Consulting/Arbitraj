      - if: matrix.market == 'templedao-ethereum'
        run: |
          node contracts/build-hanji.mjs "$RUNNER_TEMP/temple" TempleAdapter
          python scripts/record_temple_ethereum.py "$RUNNER_TEMP/market.json" --artifact "$RUNNER_TEMP/temple/TempleAdapter.json"
