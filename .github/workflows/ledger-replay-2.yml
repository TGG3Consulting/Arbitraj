# Прогон по записанным сделкам бота на трёх версиях кода (вариант 28.11.2026, без Codex).
# Версии: target-sha.txt (релиз) и compare-shas.txt (базовая, предыдущая). Данные — обезличенная
# проекция project2.py, приходит зашифрованной (envelope.py) в ветке claude/ledger-envelope-<run>-<attempt>.
# Открытый ключ получателя (не секретный) runner кладёт в ветку claude/ledger-receiver-<run>-<attempt>;
# закрытый ключ и данные удаляются в конце.
# Наружу — только сводка cashflow-*.json и SHA версий (артефакт).
name: Ledger replay (deals export)
on:
  push:
    branches: [claude/ledger-replay-20261128]
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_TERM_COLOR: never
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - name: Identify versions
        id: source
        run: |
          sha=$(cat harness/tools/profit_ledger_replay/target-sha.txt)
          base=$(sed -n 1p harness/tools/profit_ledger_replay/compare-shas.txt)
          prev=$(sed -n 2p harness/tools/profit_ledger_replay/compare-shas.txt)
          for v in "$sha" "$base" "$prev"; do [[ "$v" =~ ^[a-f0-9]{40}$ ]]; done
          echo "sha=$sha" >> "$GITHUB_OUTPUT"; echo "base=$base" >> "$GITHUB_OUTPUT"; echo "prev=$prev" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.source.outputs.sha }}
          path: release
      - name: Create one-time receiver
        run: |
          umask 077
          /usr/bin/python3 -m pip install --quiet --user cryptography requests
          /usr/bin/python3 harness/tools/profit_ledger_replay/envelope.py keygen "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/public.pem"
      - name: Publish receiver public key
        working-directory: harness
        run: |
          git config user.name "github-actions"; git config user.email "github-actions@users.noreply.github.com"
          git checkout -q --orphan receiver
          git rm -rq --cached . ; cp "$RUNNER_TEMP/public.pem" public.pem
          git add public.pem; git commit -qm "receiver ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          git push -q origin HEAD:refs/heads/claude/ledger-receiver-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          git checkout -q -f "$GITHUB_SHA"
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: release -> target
          shared-key: tests
      - name: Prepare compared sources
        run: |
          git -C release fetch -q --depth=1 origin ${{ steps.source.outputs.base }}
          git -C release worktree add --quiet --detach ../baseline FETCH_HEAD
          git -C release fetch -q --depth=1 origin ${{ steps.source.outputs.prev }}
          git -C release worktree add --quiet --detach ../previous FETCH_HEAD
      - name: Build ledger replay in each version
        run: |
          export CARGO_TARGET_DIR="$GITHUB_WORKSPACE/release/target"
          controls="$GITHUB_WORKSPACE/harness/tools/profit_ledger_replay"
          for tree in baseline previous release; do
            (
              cd "$tree"
              cp "$controls/replay2.rs" tests/profit_private_replay.rs
              if ! cargo test --locked --test profit_private_replay --no-run --message-format=json-render-diagnostics > "$RUNNER_TEMP/build.jsonl" 2> "$RUNNER_TEMP/build.txt"; then
                grep -E 'error(\[E[0-9]+\])?:|--> ' -A 5 "$RUNNER_TEMP/build.txt" | head -n 80 || true
                exit 1
              fi
              binary=$(jq -r 'select(.reason=="compiler-artifact" and .target.name=="profit_private_replay" and .executable != null) | .executable' "$RUNNER_TEMP/build.jsonl")
              cp "$binary" "$RUNNER_TEMP/suite-$tree"
              git rev-parse HEAD > "$RUNNER_TEMP/$tree-sha.txt"
            )
          done
      - name: Receive anonymous data
        working-directory: harness
        run: |
          ref=refs/heads/claude/ledger-envelope-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}
          for i in $(seq 1 48); do
            if git ls-remote --exit-code origin "$ref" >/dev/null 2>&1; then break; fi
            sleep 25
          done
          git fetch -q --depth=1 origin "$ref"
          git show FETCH_HEAD:ledger.enc > "$RUNNER_TEMP/envelope"
          /usr/bin/python3 tools/profit_ledger_replay/envelope.py open "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/private.json" "$RUNNER_TEMP/envelope"
          rm -f "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/envelope"
      - name: Verify TLOS receipt on public BSC nodes
        run: |
          /usr/bin/python3 harness/tools/profit_ledger_replay/tlos_fix.py "$RUNNER_TEMP/private.json" \
            https://bsc-dataseed.bnbchain.org https://bsc-dataseed1.defibit.io https://bsc-rpc.publicnode.com
      - name: Replay every deal and publish aggregate only
        run: |
          export PRIVATE_LEDGER_INPUT="$RUNNER_TEMP/private.json"
          for tree in baseline previous release; do
            export LEDGER_RESULT="$RUNNER_TEMP/cashflow-$tree.json"
            if ! "$RUNNER_TEMP/suite-$tree" > "$RUNNER_TEMP/replay.txt" 2>&1; then
              grep -E 'panicked at|assertion|FAILED' -A 5 "$RUNNER_TEMP/replay.txt" | head -n 80 || true
              exit 1
            fi
            test -s "$LEDGER_RESULT"
          done
      - name: Remove private test inputs
        if: always()
        run: rm -f "$RUNNER_TEMP/private.json" "$RUNNER_TEMP/key.pem" "$RUNNER_TEMP/envelope"
      - uses: actions/upload-artifact@v4
        with:
          name: aggregate-${{ steps.source.outputs.sha }}
          path: |
            ${{ runner.temp }}/cashflow-*.json
            ${{ runner.temp }}/*-sha.txt
