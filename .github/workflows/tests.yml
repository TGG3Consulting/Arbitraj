# Полный прогон тестов параллельными частями на машинах GitHub (Тигран 15.11.2026: «сборка в гите», ускорить прогон).
# Запускается на пуш в ветки test/** (ветки только для прогона — никуда не сливаются, сервер не трогают) и вручную.
# Все наборы tests/*.rs делятся на SHARDS частей по порядку имён (номер файла mod SHARDS); часть 0 дополнительно
# гонит --lib, --bins и doc-тесты. Отдельная работа — clippy -D warnings. Версия Rust закреплена той же, что у
# разработчиков, чтобы линтер не расходился.
name: Tests (parallel)
on:
  push:
    branches: ["test/**"]
  workflow_dispatch:
    inputs:
      ethereum_open_archive:
        description: Replay Ethereum Xchange generations and DeltaSwap on the pinned canonical state
        type: boolean
        default: false
      market_replay_only:
        description: Run only the selected archive replay; use a separate full run for the release SHA
        type: boolean
        default: false
      ethereum_open_subset:
        description: Optional JSON list of market IDs from ethereum-open-markets to replay
        type: string
        default: ""
      fraxswap_archive_replay:
        description: Replay the V5 Fraxswap adapter against the canonical TWAMM snapshot
        type: boolean
        default: false
      hanji_archive_replay:
        description: Replay the CI-built contract against the pinned Base block
        type: boolean
        default: false
      fermi_archive_replay:
        description: Replay the CI-built executor against the two recorded Ethereum builder frames
        type: boolean
        default: false
      ethervista_archive_replay:
        description: Measure EtherVista native fees, payouts and rollback on Base and Ethereum
        type: boolean
        default: false
      oasis_archive_replay:
        description: Compare the OasisSwap router and the compiled V5 adapter on one canonical Base block
        type: boolean
        default: false
      base_classic_archive:
        description: Replay all Base classic Solidly registries and the V5 wallet
        type: boolean
        default: false
      base_settlement_replay:
        description: Replay Base native router, callback and Vault wallet settlement against the common block
        type: boolean
        default: false
      base_factory_directory:
        description: Reconstruct every pool created by the three Base fork deployers
        type: boolean
        default: false
      stack_check_only:
        description: Compare BSC startup futures and repeat the untouched trading check on historical commits
        type: boolean
        default: false
      stack_check_target:
        description: BSC regression to measure in the isolated stack check
        type: choice
        options: [startup, load]
        default: startup
      native_v3_only:
        description: Run only the read-only replay of the three Base fork routers
        type: boolean
        default: false
      community_archive_replay:
        description: Quote both sides of all registered Ethereum CommunityV3 pools at the pinned block
        type: boolean
        default: false
      whiteswap_archive_replay:
        description: Compare funded Ethereum WhiteSwap EOA discounts and V5 wallet balances
        type: boolean
        default: false
      derpdex_archive_replay:
        description: Replay Base concentrated-liquidity markets and their native routers on the archived block
        type: boolean
        default: false
      ring_archive_replay:
        description: Replay Ring Few underlying swaps at the pinned Ethereum block
        type: boolean
        default: false
      solidly_archive_replay:
        description: Replay the CI-built Solidly V3 module on Base and Ethereum
        type: boolean
        default: false
      elfomo_archive_replay:
        description: Replay the CI-built ElfomoFi module on Base
        type: boolean
        default: false
env:
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_INCREMENTAL: "0"
  SHARDS: "8"
jobs:
  clippy:
    if: ${{ !inputs.native_v3_only && !inputs.stack_check_only && !(inputs.market_replay_only && inputs.ethereum_open_archive && inputs.ethereum_open_subset) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: clippy
      - run: cargo clippy --all-targets --locked -- -D warnings
  tests:
    if: ${{ !inputs.native_v3_only && !inputs.stack_check_only && !(inputs.market_replay_only && inputs.ethereum_open_archive && inputs.ethereum_open_subset) }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
          save-if: ${{ matrix.shard == 0 }}
      - name: Синтетический архив старой схемы учёта денежных обязательств
        if: matrix.shard == 0
        run: python3 scripts/measure_cash_index.py "$RUNNER_TEMP/cash-hold-index.json"
      - uses: actions/upload-artifact@v4
        if: matrix.shard == 0
        with:
          name: cash-hold-index
          path: ${{ runner.temp }}/cash-hold-index.json
      - name: Наборы этой части
        id: pick
        run: |
          args=""
          i=0
          for f in $(ls tests/*.rs | sort); do
            if [ $((i % SHARDS)) -eq ${{ matrix.shard }} ]; then args="$args --test $(basename "$f" .rs)"; fi
            i=$((i + 1))
          done
          echo "args=$args" >> "$GITHUB_OUTPUT"
          echo "HEAD $(git rev-parse HEAD); всего наборов $i"
      - name: Тесты части
        env:
          ARB_MOONISWAP_INVERSE_EXPORT: ${{ runner.temp }}/mooniswap-inverse.json
          ARB_AMMALGAM_INVERSE_EXPORT: ${{ runner.temp }}/ammalgam-inverse.json
          ARB_RANGES_BOUNDARIES: ${{ runner.temp }}/ranges-boundaries.json
          ARB_CARBON_ALLOCATION_EXPORT: ${{ runner.temp }}/carbon-order-vectors.json
        run: |
          extra=""
          if [ "${{ matrix.shard }}" = "0" ]; then extra="--lib --bins"; fi
          cargo test --locked --no-fail-fast $extra ${{ steps.pick.outputs.args }}
      - if: matrix.shard == 0
        uses: actions/upload-artifact@v4
        with:
          name: ammalgam-inverse-evaluations
          path: ${{ runner.temp }}/ammalgam-inverse.json
          if-no-files-found: error
      - if: ${{ !cancelled() && matrix.shard == 0 }}
        uses: actions/upload-artifact@v4
        with:
          name: mooniswap-inverse-evaluations
          path: ${{ runner.temp }}/mooniswap-inverse.json
          if-no-files-found: error
      - name: Compare minimum exact-input debits and their predecessors with the official Ranges Router
        if: inputs.ethereum_open_archive && contains(steps.pick.outputs.args, '--test puzzle_ranges_ethereum')
        run: |
          python -m pip install --quiet requests==2.32.5 eth-abi==5.2.0 eth-utils==5.3.1 pycryptodome==3.23.0
          python scripts/record_ranges_quotes.py "$RUNNER_TEMP/ranges-boundaries.json.gz" --requests "$RUNNER_TEMP/ranges-boundaries.json"
      - uses: actions/upload-artifact@v4
        if: inputs.ethereum_open_archive && contains(steps.pick.outputs.args, '--test puzzle_ranges_ethereum')
        with:
          name: ranges-ethereum-debit-boundaries
          path: ${{ runner.temp }}/ranges-boundaries.json*
          if-no-files-found: error
      - if: matrix.shard == 0 && inputs.ethereum_open_archive
        uses: actions/upload-artifact@v4
        with:
          name: carbon-order-vectors
          path: ${{ runner.temp }}/carbon-order-vectors.json
          if-no-files-found: error
      # t190: таблица «ближайшая большая» против интерполяции на записи 18.11 — вывод теста виден только с --nocapture.
      - name: Таблица кривых крючков (t190)
        if: matrix.shard == 0
        run: cargo test --locked --test bsc_dex_hook_curve_t190 -- --nocapture
      - name: Doc-тесты
        if: matrix.shard == 0
        run: cargo test --locked --doc
  community-archive:
    if: inputs.community_archive_replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests==2.32.5 eth-abi==5.2.0 eth-utils==5.3.1 pycryptodome==3.23.0 rlp==4.1.0
      - uses: actions/cache/restore@v4
        id: community-cache
        with:
          path: ${{ runner.temp }}/communityv3-depth.sqlite
          key: community-v3-archive-v1-${{ hashFiles('contracts/out/VirtualQuoter.bin-runtime', 'tests/data/first_run_dex_2026-11-26/community_v3_storage.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: community-v3-archive-v1-${{ hashFiles('contracts/out/VirtualQuoter.bin-runtime', 'tests/data/first_run_dex_2026-11-26/community_v3_storage.json') }}-
      - run: python scripts/record_community_v3_depth.py "$RUNNER_TEMP/communityv3-depth.json"
      - uses: actions/cache/save@v4
        if: ${{ !cancelled() }}
        with:
          path: ${{ runner.temp }}/communityv3-depth.sqlite
          key: ${{ steps.community-cache.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: communityv3-ethereum-depth
          path: ${{ runner.temp }}/communityv3-depth.json
  bsc-startup-stack:
    if: inputs.stack_check_only
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        revision: ${{ fromJSON(inputs.stack_check_target == 'load' && '["e3cbb230a","4d104b383","candidate"]' || '["0bff8340","ffce2052","candidate"]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
          save-if: false
      - name: Compare the same BSC check on each revision
        env:
          REVISION: ${{ matrix.revision }}
          CASE: ${{ inputs.stack_check_target }}
        run: |
          test_file=tests/bsc_dex_check_start.rs
          args=()
          if [[ "$CASE" == load ]]; then
            test_file=tests/bsc_dex_review_t153.rs
            args+=(--load)
          fi
          cp "$test_file" "$RUNNER_TEMP/check.rs"
          cp scripts/measure_bsc_startup_stack.py "$RUNNER_TEMP/measure.py"
          if [[ "$REVISION" == candidate ]]; then
            args+=(--candidate)
          else
            git checkout --detach "$REVISION"
            cp "$RUNNER_TEMP/check.rs" "$test_file"
          fi
          python "$RUNNER_TEMP/measure.py" "$RUNNER_TEMP/bsc-startup.json" "${args[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bsc-${{ inputs.stack_check_target || 'startup' }}-stack-${{ matrix.revision }}
          path: ${{ runner.temp }}/bsc-startup.json
  base-v3-factory-directory:
    if: inputs.base_factory_directory
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests==2.32.5 eth-abi==5.2.0 eth-utils==5.3.1 pycryptodome==3.23.0
      - run: python scripts/record_base_native_v3_directory.py "$RUNNER_TEMP/base-v3-directory.json"
      - uses: actions/upload-artifact@v4
        with:
          name: base-v3-factory-directory
          path: ${{ runner.temp }}/base-v3-directory.json
  base-native-v3:
    if: inputs.native_v3_only || inputs.derpdex_archive_replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests==2.32.5 eth-abi==5.2.0 eth-utils==5.3.1 pycryptodome==3.23.0 beautifulsoup4==4.13.5 PyYAML==6.0.3
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: contracts
        run: npm ci --no-audit --no-fund
      - run: node contracts/build-hanji.mjs "$RUNNER_TEMP/base-module" BasePmmExecutor
      - run: python scripts/record_base_native_v3.py "$RUNNER_TEMP/base-native-v3.json" --module "$RUNNER_TEMP/base-module/BasePmmExecutor.json"
      - uses: actions/upload-artifact@v4
        with:
          name: base-native-v3-replay
          path: ${{ runner.temp }}/base-native-v3.json
  whiteswap-archive:
    if: inputs.whiteswap_archive_replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests==2.32.5 eth-abi==5.2.0 eth-utils==5.3.1 pycryptodome==3.23.0
      - run: python scripts/record_whiteswap_wallets.py "$RUNNER_TEMP/whiteswap-wallets.json"
      - uses: actions/upload-artifact@v4
        with:
          name: whiteswap-ethereum-wallets
          path: ${{ runner.temp }}/whiteswap-wallets.json
      - run: python scripts/record_whiteswap_directory.py "$RUNNER_TEMP/whiteswap-directory.json"
      - uses: actions/upload-artifact@v4
        with:
          name: whiteswap-ethereum-directory
          path: ${{ runner.temp }}/whiteswap-directory.json
  derpdex-archive:
    if: inputs.derpdex_archive_replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests==2.32.5 eth-abi==5.2.0 eth-utils==5.3.1 pycryptodome==3.23.0 beautifulsoup4==4.13.5 PyYAML==6.0.3 rlp==4.1.0
      - run: python scripts/record_derpdex_directory.py --verify-file tests/data/first_run_dex_2026-11-26/derpdex_directory.json
      - run: python scripts/record_derpdex_markets.py "$RUNNER_TEMP/derpdex-base.json"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: derpdex-base-markets
          path: ${{ runner.temp }}/derpdex-base.json
  ring-archive:
    if: inputs.ring_archive_replay
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests==2.32.5 eth-abi==5.2.0 eth-utils==5.3.1 pycryptodome==3.23.0
      - run: python scripts/record_ring_ethereum.py "$RUNNER_TEMP/ring-ethereum.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ring-ethereum-replay
          path: ${{ runner.temp }}/ring-ethereum.json
      - run: python scripts/record_ring_markets.py "$RUNNER_TEMP/ring-markets.json"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: ring-registered-markets
          path: ${{ runner.temp }}/ring-markets.json
  carbon-allocation:
    if: inputs.ethereum_open_archive
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: carbon-order-vectors
          path: ${{ runner.temp }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet requests==2.32.5 eth-abi==5.2.0 eth-utils==5.3.1 pycryptodome==3.23.0
      - run: python scripts/replay_carbon_allocations.py "$RUNNER_TEMP/carbon-order-vectors.json" "$RUNNER_TEMP/carbon-wallet-allocations.json"
      - uses: actions/upload-artifact@v4
        with:
          name: carbon-wallet-allocations
          path: ${{ runner.temp }}/carbon-wallet-allocations.json
  mint-club-evm:
    if: ${{ !inputs.native_v3_only && !inputs.stack_check_only && !(inputs.market_replay_only && inputs.ethereum_open_archive && inputs.ethereum_open_subset) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: contracts/evmtest/package-lock.json
      - run: npm ci --prefix contracts/evmtest --no-audit --no-fund
      - run: node contracts/evmtest/mint_club.mjs
  hanji-executor:
    if: ${{ !inputs.native_v3_only && !inputs.stack_check_only && !(inputs.market_replay_only && inputs.ethereum_open_archive && inputs.ethereum_open_subset) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - working-directory: contracts
        run: npm ci --no-audit --no-fund
      - id: compile_hanji
        run: node contracts/build-hanji.mjs "$RUNNER_TEMP/hanji-executor"
      - id: compile_fermi
        run: node contracts/build-hanji.mjs "$RUNNER_TEMP/fermi-executor" FermiSlotExecutor
      - run: node contracts/build-hanji.mjs "$RUNNER_TEMP/solidly-executor" SolidlyV3Executor
      - run: node contracts/build-hanji.mjs "$RUNNER_TEMP/fraxswap" FraxswapAdapter
      - uses: actions/upload-artifact@v4
        with:
          name: fraxswap-adapter
          path: ${{ runner.temp }}/fraxswap/FraxswapAdapter.json
      - run: node contracts/build-hanji.mjs "$RUNNER_TEMP/oasisswap" OasisSwapAdapter
      - uses: actions/upload-artifact@v4
        with:
          name: oasisswap-adapter
          path: ${{ runner.temp }}/oasisswap/OasisSwapAdapter.json
      - run: node contracts/build-hanji.mjs "$RUNNER_TEMP/ethervista" EtherVistaAdapter
      - uses: actions/upload-artifact@v4
        with:
          name: ethervista-adapter
          path: ${{ runner.temp }}/ethervista/EtherVistaAdapter.json
      - run: node contracts/build-hanji.mjs "$RUNNER_TEMP/elfomo-executor" ElfomoExecutor
      - run: node contracts/build-hanji.mjs "$RUNNER_TEMP/base-pmm-executor" BasePmmExecutor
      - uses: actions/upload-artifact@v4
        with:
          name: base-pmm-executor
          path: ${{ runner.temp }}/base-pmm-executor/BasePmmExecutor.json
      - uses: actions/upload-artifact@v4
        with:
          name: elfomo-executor
          path: ${{ runner.temp }}/elfomo-executor/ElfomoExecutor.json
      - uses: actions/upload-artifact@v4
        with:
          name: solidly-v3-executor
          path: ${{ runner.temp }}/solidly-executor/SolidlyV3Executor.json
      - uses: actions/upload-artifact@v4
        with:
          name: fermi-slot-executor
          path: ${{ runner.temp }}/fermi-executor/FermiSlotExecutor.json
      - uses: actions/upload-artifact@v4
        with:
          name: hanji-executor
          path: ${{ runner.temp }}/hanji-executor/HanjiExecutor.json
      - uses: actions/setup-python@v5
        if: inputs.fraxswap_archive_replay || inputs.hanji_archive_replay || inputs.fermi_archive_replay || inputs.solidly_archive_replay || inputs.elfomo_archive_replay
        with:
          python-version: '3.12'
      - if: inputs.fraxswap_archive_replay
        name: Check Fraxswap TWAMM settlement on unchanged V5
        run: |
          python -m pip install --quiet requests==2.32.5 eth-abi==5.2.0 eth-utils==5.3.1 pycryptodome==3.23.0
          python scripts/record_fraxswap_swaps.py tests/data/first_run_dex_2026-11-26/fraxswap_ethereum.json "$RUNNER_TEMP/fraxswap-swaps.json" --endpoint https://eth.drpc.org --adapter "$RUNNER_TEMP/fraxswap/FraxswapAdapter.json"
      - uses: actions/upload-artifact@v4
        if: inputs.fraxswap_archive_replay
        with:
          name: fraxswap-v5-settlement
          path: ${{ runner.temp }}/fraxswap-swaps.json
      - if: inputs.elfomo_archive_replay
        name: Verify ElfomoFi module receipts and wallet balances at the recorded Base block
        run: |
          pip install --quiet requests==2.32.5 eth-abi==5.2.0 eth-utils==5.3.1 pycryptodome==3.23.0 beautifulsoup4==4.13.5 PyYAML==6.0.3
          python scripts/record_elfomo_executor.py "$RUNNER_TEMP/elfomo-executor/ElfomoExecutor.json"
          python scripts/record_elfomo_ladders.py "$RUNNER_TEMP/elfomo-executor/ElfomoExecutor.json"
          python scripts/record_base_pmm_executor.py "$RUNNER_TEMP/base-pmm-executor/BasePmmExecutor.json"
      - if: inputs.elfomo_archive_replay
        name: Compare Virtuals and Horizon native and protected wallet execution
        run: |
          for market in virtuals-base virtuals-unicorn-base horizon; do
            python scripts/record_virtuals_wallets.py "$market" "$RUNNER_TEMP/base-pmm-executor/BasePmmExecutor.json" "$RUNNER_TEMP/base-pmm-executor/$market-wallets.json"
          done
      - uses: actions/upload-artifact@v4
        if: inputs.elfomo_archive_replay
        with:
          name: elfomo-archive-replay
          path: |
            tests/data/first_run_dex_2026-11-26/elfomo_executor_base.json
            tests/data/first_run_dex_2026-11-26/elfomo_ladders_base.json
            tests/data/first_run_dex_2026-11-26/base_pmm_executor_*.json
            ${{ runner.temp }}/base-pmm-executor/*-wallets.json
      - if: inputs.solidly_archive_replay
        name: Simulate Solidly V3 module with real wallet balances
        run: |
          pip install --quiet requests==2.32.5 eth-abi==5.2.0 eth-utils==5.3.1 pycryptodome==3.23.0 beautifulsoup4==4.13.5 PyYAML==6.0.3
          for network in base ethereum; do
            python scripts/record_solidly_v3_executor.py "$RUNNER_TEMP/solidly-executor/SolidlyV3Executor.json" "$network" --record-acceptance
          done
      - uses: actions/upload-artifact@v4
        if: inputs.solidly_archive_replay
        with:
          name: solidly-v3-archive-replay
          path: |
            tests/data/first_run_dex_2026-11-26/solidly_v3_executor_*.json
            config/first_run_dex.json
      - id: replay_hanji
        if: ${{ !cancelled() && inputs.hanji_archive_replay && steps.compile_hanji.outcome == 'success' }}
        run: |
          pip install --quiet requests==2.32.5 eth-abi==5.2.0 eth-utils==5.3.1 pycryptodome==3.23.0
          python scripts/record_hanji_executor.py "$RUNNER_TEMP/hanji-executor/HanjiExecutor.json" "$RUNNER_TEMP/hanji-executor/base-replay.json"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.replay_hanji.outcome == 'success' }}
        with:
          name: hanji-base-replay
          path: ${{ runner.temp }}/hanji-executor/base-replay.json
      - if: ${{ !cancelled() && inputs.fermi_archive_replay && steps.compile_fermi.outcome == 'success' }}
        id: replay_fermi
        run: |
          pip install --quiet requests==2.32.5 eth-abi==5.2.0 eth-utils==5.3.1 pycryptodome==3.23.0
          python scripts/record_fermi_executor.py "$RUNNER_TEMP/fermi-executor/FermiSlotExecutor.json" "$RUNNER_TEMP/fermi-executor/ethereum-replay.json"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.replay_fermi.outcome == 'success' }}
        with:
          name: fermi-slot-replay
          path: ${{ runner.temp }}/fermi-executor/ethereum-replay.json
  ethereum-open-markets:
    if: inputs.ethereum_open_archive
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
