name: SHOPINX revision checks
on:
  push:
    branches: [codex/check-shopinx-volume]
jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 267eab04eaf1867a89d42cfa6f67fcc62a002b81
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: shop-volume
      - run: cargo test --locked --test core_fit_volume_294 --test bsc_dex_graph --test bsc_dex_graph_fit_300 --test bsc_dex_graph_shared --test bsc_dex_graph_shared_split --test bsc_dex_split --test bsc_dex_fit_graph_294 --test report_missed --test report_capital --test uncapped_decided --test uncapped_maxwin --test uncapped_recompute
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 267eab04eaf1867a89d42cfa6f67fcc62a002b81
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
