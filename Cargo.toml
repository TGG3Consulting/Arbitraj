[package]
name = "arb"
version = "0.1.0"
edition = "2024"

[dependencies]
alloy-primitives = { version = "1.7.3", features = ["serde"] }
argon2 = "0.6.0"
async-trait = "0.1.92"
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
chrono = { version = "0.4.45", features = ["serde"] }
flate2 = "1.1.10"
futures-util = "0.3.34"
getrandom = "0.4.3"
hex = "0.4.3"
hmac = "0.13.0"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rust_decimal = { version = "1.43.0", features = ["maths", "serde-with-str"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["arbitrary_precision"] }
sha2 = "0.11.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots"] }
tower-http = { version = "0.7.1", features = ["fs"] }
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
zeroize = { version = "1.9.1", features = ["serde"] }
zstd = "0.14.3"
