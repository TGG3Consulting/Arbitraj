name: Poloniex manual settlement control
on:
  push:
    branches: [codex/poloniex-profit-control-ci-20261125]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: tests
      - run: cargo fmt --check
      - run: cargo test --locked --lib core::sale_preview && cargo test --locked --lib core::manual_price && cargo test --locked --lib venues::poloniex::transfers
      - run: cargo clippy --lib --locked -- -D warnings
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
