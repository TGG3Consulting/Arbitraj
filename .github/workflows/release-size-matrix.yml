name: Release size matrix
on:
  push:
    branches: ["audit/control-combined-fixedreal-20261125"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inventory:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: list
        shell: bash
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          ref = os.environ["GITHUB_REF_NAME"]
          attribution = "-attribution-" in ref
          inventory = "control.json"
          rows = json.loads((Path("tools/release_size_matrix") / inventory).read_text(encoding="utf-8-sig"))
          assert len(rows) == len({r["sha"] for r in rows}) == 1
          if attribution and ref.endswith("-retry"):
              rows = [r for r in rows if r["sha"].startswith(("98530a48", "534a97a1"))]
              assert len(rows) == 2
          if not attribution and ref.endswith("-smoke"):
              anchors = ("f896a133", "cc1b4ef0", "7491b1e7", "8e02cc8")
              rows = [r for r in rows if r["sha"].startswith(anchors)]
              assert len(rows) == len(anchors)
          print("matrix=" + json.dumps({"include": rows}, separators=(",", ":")))
          PY
  replay:
    needs: inventory
    runs-on: ubuntu-latest
    name: Replay ${{ matrix.run }}
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix: ${{ fromJSON(needs.inventory.outputs.matrix) }}
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      RELEASE_SHA: ${{ matrix.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: harness
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.sha }}
          path: release
      - name: Verify revision and adapt test interface
        shell: bash
        run: |
          test "$(git -C release rev-parse HEAD)" = "$RELEASE_SHA"
          python harness/tools/release_size_matrix/adapt.py release
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: release -> target
          shared-key: release-size-matrix
      - name: Run native routing on saved pool states
        if: contains(github.ref_name, '-native-') || contains(github.ref_name, '-combined-')
        shell: bash
        run: |
          set -eo pipefail
          python harness/tools/release_size_matrix/native_routes.py release > native-route-meta.json
          if python -c 'import json,sys; sys.exit(json.load(open("native-route-meta.json"))["status"] != "staged")'; then
            (cd release && cargo test --locked --test native_route_release_matrix native_route_release_matrix -- --exact --nocapture) > "$RUNNER_TEMP/native.log" 2>&1 || {
              grep -m 15 -A 4 -E 'error(\[E[0-9]+\])?:|panicked at|assertion|FAILED' "$RUNNER_TEMP/native.log" | head -n 80 || true
              exit 1
            }
            sed -n 's/^NATIVE_ROUTE_MATRIX //p' "$RUNNER_TEMP/native.log" > native-route.jsonl
            test "$(wc -l < native-route.jsonl)" -eq 80
          fi
      - uses: actions/upload-artifact@v4
        if: contains(github.ref_name, '-native-') || contains(github.ref_name, '-combined-')
        with:
          name: native-route-${{ matrix.sha }}
          path: |
            native-route-meta.json
            native-route.jsonl
          if-no-files-found: error
      - name: Cross-replay recorded trades on native cost and size code
        if: contains(github.ref_name, '-stored-') || contains(github.ref_name, '-combined-')
        shell: bash
        run: |
          set -eo pipefail
          python harness/tools/release_size_matrix/stored_compare.py release harness/tools/release_size_matrix/stored_cases.json > stored-meta.json
          expected=$(python -c 'import json; print(json.load(open("stored-meta.json")).get("expected_rows", 0))')
          if [[ "$expected" != 0 ]]; then
            (cd release && cargo test --locked --test core_size_stored_compare stored_trade_matrix -- --exact --nocapture) > "$RUNNER_TEMP/stored.log" 2>&1 || {
              grep -m 15 -A 4 -E 'error(\[E[0-9]+\])?:|panicked at|assertion|FAILED' "$RUNNER_TEMP/stored.log" | head -n 80 || true
              exit 1
            }
            sed -n 's/^STORED_TRADE_MATRIX //p' "$RUNNER_TEMP/stored.log" > stored-replay.jsonl
            test "$(wc -l < stored-replay.jsonl)" -eq "$expected"
          fi
      - uses: actions/upload-artifact@v4
        if: contains(github.ref_name, '-stored-') || contains(github.ref_name, '-combined-')
        with:
          name: stored-replay-${{ matrix.sha }}
          path: |
            stored-meta.json
            stored-replay.jsonl
          if-no-files-found: error
      - name: Cross-replay real trades on a verified fixed V2 route
        if: contains(github.ref_name, '-fixedv2-') || contains(github.ref_name, '-fixedreal-')
        shell: bash
        run: |
          set -eo pipefail
          python harness/tools/release_size_matrix/actual_v2.py stage release harness/tools/release_size_matrix/actual_v2_cases.json > fixedv2-meta.json
          expected=$(python -c 'import json; print(json.load(open("fixedv2-meta.json")).get("expected_rows", 0))')
          if [[ "$expected" != 0 ]]; then
            (cd release && CARGO_TERM_COLOR=never cargo test --locked --test core_size_actual_v2 actual_v2_matrix -- --exact --nocapture) > "$RUNNER_TEMP/fixedv2.log" 2>&1 || {
              grep -i -m 15 -A 4 -E 'error|panicked at|assertion|FAILED|signal:' "$RUNNER_TEMP/fixedv2.log" | head -n 80 || true
              exit 1
            }
            sed -n -E 's/^(test [^ ]+ \.\.\. )?ACTUAL_V2_MATRIX //p' "$RUNNER_TEMP/fixedv2.log" > fixedv2-replay.jsonl
            test "$(wc -l < fixedv2-replay.jsonl)" -eq "$expected"
          fi
      - uses: actions/upload-artifact@v4
        if: contains(github.ref_name, '-fixedv2-') || contains(github.ref_name, '-fixedreal-')
        with:
          name: fixedv2-replay-${{ matrix.sha }}
          path: |
            fixedv2-meta.json
            fixedv2-replay.jsonl
          if-no-files-found: error
      - name: Cross-replay real trades on a verified fixed V3 route
        if: contains(github.ref_name, '-fixedv3-') || contains(github.ref_name, '-fixedreal-')
        shell: bash
        run: |
          set -eo pipefail
          python harness/tools/release_size_matrix/actual_v3.py stage release harness/tools/release_size_matrix/actual_v3_cases.json > fixedv3-meta.json
          expected=$(python -c 'import json; print(json.load(open("fixedv3-meta.json")).get("expected_rows", 0))')
          if [[ "$expected" != 0 ]]; then
            (cd release && CARGO_TERM_COLOR=never cargo test --locked --test core_size_actual_v3 actual_v3_matrix -- --exact --nocapture) > "$RUNNER_TEMP/fixedv3.log" 2>&1 || {
              grep -i -m 15 -A 4 -E 'error|panicked at|assertion|FAILED|signal:' "$RUNNER_TEMP/fixedv3.log" | head -n 80 || true
              exit 1
            }
            sed -n -E 's/^(test [^ ]+ \.\.\. )?ACTUAL_V3_MATRIX //p' "$RUNNER_TEMP/fixedv3.log" > fixedv3-replay.jsonl
            test "$(wc -l < fixedv3-replay.jsonl)" -eq "$expected"
          fi
      - uses: actions/upload-artifact@v4
        if: contains(github.ref_name, '-fixedv3-') || contains(github.ref_name, '-fixedreal-')
        with:
          name: fixedv3-replay-${{ matrix.sha }}
          path: |
            fixedv3-meta.json
            fixedv3-replay.jsonl
          if-no-files-found: error
      - name: Run native size selection against the common cases
        if: success()
        shell: bash
        working-directory: release
        run: |
          set -eo pipefail
          case "$GITHUB_REF_NAME" in
            *-routes-*|*-combined-*) test_case=routes::release_size_matrix_routes; expected=10240 ;;
            *) test_case=release_size_matrix; expected=180 ;;
          esac
          CARGO_TERM_COLOR=never cargo test --locked --test core_size_release_matrix "$test_case" -- --exact --nocapture > "$RUNNER_TEMP/replay.log" 2>&1 || {
            grep -i -m 15 -A 4 -E 'error|panicked at|assertion|FAILED|killed|no space|could not|signal:|lock file' "$RUNNER_TEMP/replay.log" | head -n 80 || true
            exit 1
          }
          sed -n -E 's/^(test [^ ]+ \.\.\. )?SIZE_MATRIX //p' "$RUNNER_TEMP/replay.log" > ../replay.jsonl
          count="$(wc -l < ../replay.jsonl)"
          if [[ "$count" != "$expected" ]]; then
            printf 'Replay returned %s rows, expected %s\n' "$count" "$expected"
            grep -m 8 -E 'running [0-9]+ test|test result:|SIZE_MATRIX ' "$RUNNER_TEMP/replay.log" | cut -c1-180 || true
            exit 1
          fi
      - name: Isolate bound-probe count and percentage-gate effects
        if: contains(github.ref_name, '-attribution-')
        shell: bash
        working-directory: release
        run: |
          set -eo pipefail
          for mode in serial-bounds percentage-gate-off; do
            if [[ "$mode" == serial-bounds ]]; then
              export SIZE_MATRIX_PROBES=1 SIZE_MATRIX_PCT_MODE=on
            else
              export SIZE_MATRIX_PROBES=3 SIZE_MATRIX_PCT_MODE=off
            fi
            cargo test --locked --test core_size_release_matrix release_size_matrix -- --exact --nocapture > "$RUNNER_TEMP/$mode.log" 2>&1 || {
              grep -m 15 -A 4 -E 'error(\[E[0-9]+\])?:|panicked at|assertion|FAILED' "$RUNNER_TEMP/$mode.log" | head -n 80 || true
              exit 1
            }
            sed -n -E 's/^(test [^ ]+ \.\.\. )?SIZE_MATRIX //p' "$RUNNER_TEMP/$mode.log" > "../$mode.jsonl"
            test "$(wc -l < "../$mode.jsonl")" -eq 180
          done
      - uses: actions/upload-artifact@v4
        if: contains(github.ref_name, '-attribution-')
        with:
          name: attribution-${{ matrix.sha }}
          path: |
            replay.jsonl
            serial-bounds.jsonl
            percentage-gate-off.jsonl
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: replay-${{ matrix.sha }}
          path: replay.jsonl
          if-no-files-found: error
