name: SHOPINX revision checks
on:
  push:
    branches: [codex/check-shopinx-volume]
jobs:
  rust:
    runs-on: ubuntu-latest
    env:
      CARGO_PROFILE_TEST_DEBUG: 0
      CARGO_PROFILE_DEV_DEBUG: 0
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b9b65a6cacf8238b533b894ae6a5d521fbda6216
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: shop-volume
      - run: cargo test --locked --test core_fit_volume_294 --test bsc_dex_fit_graph_294 --test report_missed --test report_capital
  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
        with:
          ref: b9b65a6cacf8238b533b894ae6a5d521fbda6216
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json
      - run: npm ci
      - run: npm run build
