# Файл: config/first_run.toml
# Что это: СПРАВОЧНАЯ таблица рекомендованных стартовых значений настроек («Таблица первого запуска»).
#   Это ДАННЫЕ, а не код и НЕ значения по умолчанию движка. Движок по-прежнему без стартовых значений:
#   не задана настройка — функция не работает (CLAUDE.md, docs/SETTINGS.md). Эти рекомендации СОВЕТУЕМЫЕ:
#   Тигран смотрит, подтверждает и сохраняет их сам обычным путём (экран «Настройки», с журналом изменений).
#   Автоматической записи настроек по этому файлу НЕТ.
# Кто читает: src/api/first_run.rs (эндпоинт GET /api/first-run) — отдаёт таблицу интерфейсу как есть.
# Откуда значения (правило «только факты», решение 23):
#   - лимиты площадок/протоколов и документированные адреса — задокументированное значение со ссылкой на источник;
#   - параметры поиска/алгоритма — ориентиры из docs/SETTINGS.md;
#   - капитал-зависимые money.* / risk.* — только МЕТОД (без готового числа): точное значение подбирает Тигран.
# Человекочитаемая копия таблицы — docs/FIRST_RUN.md.

advisory = true
note = "Советуемые стартовые значения. Ничего не сохраняется автоматически — Тигран подтверждает и сохраняет каждое сам на экране «Настройки» (с журналом изменений). Значения по умолчанию у движка отсутствуют."
source_note = "Лимиты площадок и адреса — из официальной документации и принятых решений (ссылка в строке «Источник»). Деньги и риск зависят от капитала — даётся метод, а не число."

